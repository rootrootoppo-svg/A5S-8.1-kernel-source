name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex \
          g++-multilib gcc-multilib git gnupg gperf libssl-dev \
          liblz4-tool lzop zip zlib1g-dev libncurses-dev

      - name: Clone toolchain
        run: |
          git clone --depth=1 https://github.com/djb77/aarch64-linux-android-4.9.git toolchain
          ls -la toolchain/bin/
          test -f toolchain/bin/aarch64-linux-android-gcc && echo "COMPILER_OK" || echo "COMPILER_MISSING"

      - name: Verify defconfig exists
        run: |
          find arch/arm64/configs/ -iname "*oppo6765_18511*"

      - name: Apply defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
          make oppo6765_18511_defconfig
          test -f .config && echo "CONFIG_OK" || echo "CONFIG_MISSING"

      - name: Build kernel
        run: |
          set -o pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
          make -j$(nproc) 2>&1 | tee build_full.log
          echo "BUILD_EXIT_CODE=$?" >> build_status.txt

      - name: Show errors and summary
        if: always()
        run: |
          echo "===== أسطر الخطأ (إن وجدت) ====="
          grep -i -E "error|fatal|cannot find|no such file" build_full.log | head -n 40 || echo "لا يوجد سطر يحتوي كلمة Error"
          echo "===== آخر 40 سطر من اللوق ====="
          tail -n 40 build_full.log
          echo "===== البحث عن ملف الكيرنل الناتج ====="
          find . -iname "Image*" -newer .config -type f 2>/dev/null

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_full.log

      - name: Upload kernel image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            arch/arm64/boot/Image.gz-dtb
            arch/arm64/boot/Image.gz
            arch/arm64/boot/Image
          if-no-files-found: warn
