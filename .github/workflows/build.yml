name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex \
          g++-multilib gcc-multilib git gnupg gperf libssl-dev \
          liblz4-tool lzop zip zlib1g-dev libncurses-dev

      - name: Clone toolchain
        run: |
          git clone --depth=1 https://github.com/mvaisakh/aarch64-linux-android-4.9 toolchain
          ls -la toolchain/
          ls -la toolchain/bin/ || echo "bin folder missing"

      - name: Verify defconfig exists
        run: |
          find arch/arm64/configs/ -iname "*oppo6765_18511*"

      - name: Apply defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
          make oppo6765_18511_defconfig

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
          make -j$(nproc) 2>&1 | tee build_full.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_full.log

      - name: Upload kernel image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: arch/arm64/boot/Image.gz-dtb
